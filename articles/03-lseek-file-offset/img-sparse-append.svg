<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360">
  <rect width="900" height="360" fill="#121826" rx="16"/>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#e8eefc}.h{font-size:21px;font-weight:600}.s{font-size:18px}.cell{stroke:#9fb8df;stroke-width:2}.data{fill:#4f8cff}.hole{fill:#303b52}.append{fill:#f0a45b}</style>
  <text x="36" y="38" class="h">普通定位 vs O_APPEND</text>
  <text x="42" y="82" class="h">普通文件：seek 到 5 再写 Z</text>
  <rect x="42" y="105" width="78" height="58" class="data"/><rect x="120" y="105" width="78" height="58" class="data"/><rect x="198" y="105" width="78" height="58" class="data"/>
  <rect x="276" y="105" width="78" height="58" class="hole"/><rect x="354" y="105" width="78" height="58" class="hole"/><rect x="432" y="105" width="78" height="58" class="data"/>
  <text x="67" y="141" class="s">a</text><text x="145" y="141" class="s">b</text><text x="223" y="141" class="s">c</text><text x="301" y="141" class="s">0</text><text x="379" y="141" class="s">0</text><text x="457" y="141" class="s">Z</text><text x="530" y="141" class="s">EOF=6</text>
  <text x="42" y="205" class="h">O_APPEND：即使 seek 到 0，Q 仍写到 EOF</text>
  <rect x="42" y="228" width="78" height="58" class="data"/><rect x="120" y="228" width="78" height="58" class="data"/><rect x="198" y="228" width="78" height="58" class="data"/><rect x="276" y="228" width="78" height="58" class="hole"/><rect x="354" y="228" width="78" height="58" class="hole"/><rect x="432" y="228" width="78" height="58" class="data"/><rect x="510" y="228" width="78" height="58" class="append"/>
  <text x="529" y="264" class="s">Q</text><text x="610" y="264" class="s">EOF=7</text>
</svg>
