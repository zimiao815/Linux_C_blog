<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <rect width="900" height="520" rx="16" fill="#121826"/>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#e8eefc}.h{font-size:24px;font-weight:600}.s{font-size:19px}.box{fill:#1d2940;stroke:#6ea8fe;stroke-width:2}.sub{fill:#263752;stroke:#9fb8df;stroke-width:2}.arrow{stroke:#f0a45b;stroke-width:3;fill:none;marker-end:url(#arr)}</style>
  <defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f0a45b"/></marker></defs>
  <text x="36" y="38" class="h">lseek 的调用路径：偏移量在打开文件描述中</text>
  <rect x="130" y="62" width="640" height="84" rx="12" class="box"/>
  <text x="165" y="98" class="h">应用层</text><text x="350" y="98" class="s">lseek(fd, 5, SEEK_SET)</text><text x="165" y="126" class="s">fd 是进程表中的索引</text>
  <path d="M450 146 L450 184" class="arrow"/><text x="470" y="173" class="s">系统调用边界</text>
  <rect x="130" y="188" width="640" height="116" rx="12" class="box"/>
  <text x="165" y="225" class="h">内核：打开文件描述</text><text x="165" y="258" class="s">当前偏移 = 5</text><text x="500" y="258" class="s">状态标志 / 引用关系</text><text x="165" y="285" class="s">dup 后的多个 fd 可以指向同一个对象</text>
  <path d="M450 304 L450 342" class="arrow"/><text x="470" y="329" class="s">按偏移访问</text>
  <rect x="130" y="346" width="640" height="116" rx="12" class="sub"/>
  <text x="165" y="383" class="h">文件系统与文件对象</text><text x="165" y="416" class="s">文件内容：abc · · Z</text><text x="520" y="416" class="s">EOF = 6</text><text x="165" y="444" class="s">空洞是否占用物理块，由文件系统决定</text>
</svg>
